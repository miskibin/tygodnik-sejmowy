# Sejmograf daily-pipeline stack for mixvm. Designed to be portainer-visible.
#
# - `ollama`: long-running embeddings server. Persistent model cache at
#   `./ollama_data`. Bound to internal compose network only.
# - `daily`: one-shot run, started by `deploy/mixvm/daily.sh` from cron
#   (`15 0 * * *` UTC, before DeepSeek's weekday peak at 01 UTC). daily.sh
#   exports the newest v* tag to ./releases/<tag> and points
#   SUPAGRAF_RELEASE_DIR at it. Exit code is non-zero when any step failed
#   (see `etl_runs`).
# - Illustrations are generated on SFGPU over SSH with a key pinned to
#   scripts/illustrations/gate.sh (forced command); ./sfgpu holds that key
#   and the host key (see docs/updater.md).
#
# All upstream services (Supabase REST at db.*.pl, Sejm API,
# DeepSeek API) are reached over public HTTPS — no extra network plumbing.

name: sejmograf

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sejmograf-ollama
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3

  daily:
    build:
      context: ${SUPAGRAF_RELEASE_DIR:-./repo}
      dockerfile: deploy/mixvm/Dockerfile.supagraf
    image: sejmograf/supagraf:local
    container_name: sejmograf-daily
    depends_on:
      ollama:
        condition: service_started
    env_file:
      - ./.env
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_BASE_URL: "http://ollama:11434"
      SUPAGRAF_LLM_TIMEOUT_S: "300"
      # Bypass Cloudflare edge timeout — talk straight to Kong on the
      # supabase_default network joined below. Kong routes /rest/v1/* to
      # supabase-rest exactly like the public HTTPS endpoint does.
      SUPABASE_URL: "http://supabase-kong:8000"
      SUPAGRAF_LAW_SCOPE: ${SUPAGRAF_LAW_SCOPE:-scoped}
      SUPAGRAF_LAW_OUTPUT: /app/law-fulltext
      # LLM steps that would start inside DeepSeek's 2x window are deferred
      # to the next run instead of paying peak price.
      SUPAGRAF_ENRICH_OFFPEAK_ONLY: "1"
      SUPAGRAF_ENABLE_ILLUSTRATIONS: ${SUPAGRAF_ENABLE_ILLUSTRATIONS:-1}
      SUPAGRAF_ILLUSTRATION_DIR: /app/illustrations
      SUPAGRAF_PUBLIC_SUPABASE_URL: https://db.msulawiak.pl
      SUPAGRAF_SFGPU_SSH: michal@sf-ai-gpu.bison-fort.ts.net
      SUPAGRAF_SFGPU_SSH_KEY: /run/sfgpu/id_ed25519
      SUPAGRAF_SFGPU_KNOWN_HOSTS: /run/sfgpu/known_hosts
    networks:
      - default
      - supabase
    # Source code is baked into the image; only persist mutable state on
    # the host. Bind-mounting /app would mask the installed .venv. The
    # daily no longer writes fixtures (the DB is the cache); the mount stays
    # for manual `fixtures capture` / `stage` runs.
    volumes:
      - ./fixtures:/app/fixtures
      - ./logs:/app/logs
      - ./law-fulltext:/app/law-fulltext
      - ./illustrations:/app/illustrations
      - ./sfgpu:/run/sfgpu:ro
    profiles: ["jobs"]   # one-shot: never auto-up, only via `compose run`
    command: ["uv", "run", "python", "-m", "supagraf", "daily", "--term", "10"]

networks:
  default:
  supabase:
    external: true
    name: supabase_default

[project]
name = "supagraf"
version = "0.1.0"
description = "Tygodnik Sejmowy — Supabase-backed pipeline + Next.js frontend for Polish Sejm legislative data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "miskibin" }]
urls = { Repository = "https://github.com/miskibin/tygodnik-sejmowy" }
dependencies = [
    "httpx>=0.27.2",
    "pydantic>=2.7.4",
    "loguru>=0.7.2",
    "supabase>=2.11.0",
    "typer>=0.17.4",
    "tenacity>=9.0.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "pytesseract>=0.3.13",
    "pymupdf4llm>=1.27.2.3",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
include = ["supagraf*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# Repo root on sys.path so `import supagraf` resolves to /supagraf/. Keep
# tests/supagraf/ WITHOUT an __init__.py; `unit/`, `contract/`, `e2e/` have one
# so duplicate basenames live in distinct module namespaces.
